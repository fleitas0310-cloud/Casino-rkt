<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casino RKT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#090909;
  color:#fff;
  min-height:100vh;
}

header{
  background:#111;
  border-bottom:2px solid #d4af37;
  padding:18px;
  text-align:center;
}

.logo{
  color:#d4af37;
  font-size:30px;
  font-weight:bold;
}

.container{
  width:92%;
  max-width:1000px;
  margin:30px auto;
}

.card{
  background:#151515;
  border:1px solid #333;
  border-radius:15px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 0 20px rgba(212,175,55,.08);
}

h1,h2,h3{
  margin-bottom:15px;
}

h2{
  color:#d4af37;
}

input,select{
  width:100%;
  padding:13px;
  margin:8px 0 14px;
  border-radius:8px;
  border:1px solid #555;
  background:#222;
  color:white;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#d4af37;
  color:#111;
  font-weight:bold;
  cursor:pointer;
  margin-top:6px;
}

button:hover{
  opacity:.85;
}

.secondary{
  background:#333;
  color:#fff;
}

.danger{
  background:#a83232;
  color:#fff;
}

.hidden{
  display:none!important;
}

.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin:20px 0;
}

.menu button{
  min-height:80px;
}

.stat{
  background:#202020;
  padding:18px;
  border-radius:10px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:25px;
  color:#d4af37;
  margin-top:7px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  border-bottom:1px solid #333;
  padding:12px 6px;
  text-align:left;
}

th{
  color:#d4af37;
}

.game{
  background:#202020;
  border-radius:12px;
  padding:20px;
  margin:12px 0;
}

.game button{
  margin-top:12px;
}

.notice{
  padding:12px;
  background:#241f0d;
  border:1px solid #66551b;
  border-radius:8px
