<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casino RKT</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#090909,#24103d);
  color:white;
}

header{
  background:#111;
  padding:20px;
  text-align:center;
  border-bottom:2px solid #9b4dff;
}

header h1{
  color:#c66cff;
  font-size:32px;
}

.container{
  max-width:500px;
  margin:auto;
  padding:20px;
}

.card{
  background:#151515;
  border:1px solid #542477;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 0 20px #000;
}

h2{
  margin-bottom:15px;
  color:#d28aff;
}

input,button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

input{
  background:#252525;
  color:white;
}

button{
  background:#9b4dff;
  color:white;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

.saldo{
  text-align:center;
  font-size:30px;
  color:#5cff9d;
  margin:15px 0;
}

.juegos{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.juego{
  background:#292929;
  padding:20px 10px;
  text-align:center;
  border-radius:12px;
}

.oculto{
  display:none;
}

.rojo{
  background:#c62828;
}

.gris{
  background:#555;
}

.admin{
  border:2px solid #ffca28;
}

.mensaje{
  text-align:center;
  margin-top:15px;
  color:#ffd54f;
}
</style>
</head>

<body>

<header>
  <h1>🎰 CASINO RKT 🎰</h1>
  <p>Casino con dinero ficticio</p>
</header>

<div class="container">

  <div id="login" class="card">
    <h2>🔐 Iniciar sesión</h2>

    <input id="usuario" type="text" placeholder="Usuario">
    <input id="clave" type="password" placeholder="Contraseña">

    <button onclick="entrar()">ENTRAR</button>

    <p class="mensaje" id="mensaje"></p>

    <p style="margin-top:15px;font-size:13px;color:#aaa">
      Usuario administrador de prueba:<br>
      admin / 1234
    </p>
  </div>


  <div id="jugador" class="oculto">

    <div class="card">
      <h2>👤 Panel del jugador</h2>

      <p>Bienvenido, <b id="nombreJugador"></b></p>

      <div class="saldo">
        $<span id="saldo">100000</span>
      </div>
    </div>

    <div class="card">
      <h2>🎮 Juegos</h2>

      <div class="juegos">

        <div class="juego">
          🎰<br><br>
          Tragamonedas
          <button onclick="jugarSlot()">JUGAR</button>
        </div>

        <div class="juego">
          🎲<br><br>
          Dados
          <button onclick="jugarDados()">JUGAR</button>
        </div>

      </div>

      <p class="mensaje" id="resultado"></p>
    </div>

    <button class="rojo" onclick="salir()">CERRAR SESIÓN</button>

  </div>


  <div id="administrador" class="oculto">

    <div class="card admin">
      <h2>👑 Panel de Administrador</h2>

      <p>Saldo del administrador:</p>

      <div class="saldo">
        ∞
      </div>

      <p style="color:#aaa;margin-bottom:15px">
        Saldo administrativo ilimitado
      </p>

      <h3>👥 Gestión de jugadores</h3>

      <input id="nuevoUsuario" type="text" placeholder="Nombre del jugador">

      <input id="saldoInicial" type="number" placeholder="Saldo inicial">

      <button onclick="crearJugador()">
        CREAR JUGADOR
      </button>

      <p class="mensaje" id="adminMensaje"></p>
    </div>

    <button class="rojo" onclick="salir()">CERRAR SESIÓN</button>

  </div>

</div>


<script>

let saldo = 100000;

function entrar(){

  const usuario =
    document.getElementById("usuario").value.trim();

  const clave =
    document.getElementById("clave").value.trim();

  if(usuario === "admin" && clave === "1234"){

    document.getElementById("login").classList.add("oculto");
    document.getElementById("administrador").classList.remove("oculto");

    return;
  }

  if(usuario !== "" && clave !== ""){

    document.getElementById("login").classList.add("oculto");
    document.getElementById("jugador").classList.remove("oculto");

    document.getElementById("nombreJugador").textContent = usuario;

    return;
  }

  document.getElementById("mensaje").textContent =
    "Completá usuario y contraseña";
}


function actualizarSaldo(){

  document.getElementById("saldo").textContent =
    saldo.toLocaleString("es-AR");

}

  const apuesta = 1000;

  if(saldo < apuesta){

    document.getElementById("resultado").textContent =
      "❌ No tenés saldo suficiente";

    return;
  }

  const gana = Math.random() < 0.45;

  if(gana){

    saldo += apuesta * 2;

    document.getElementById("resultado").textContent =
      "🎉 ¡Ganaste $2.000!";

  }else{

    document.getElementById("resultado").textContent =
      "😢 Perdiste $1.000";

  }

  actualizarSaldo();
}
